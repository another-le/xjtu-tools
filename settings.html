<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XJTU Tools · 网站与搜索词</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-mark" src="icon.png" alt="">
        <div>
          <strong>XJTU Tools</strong>
          <span>快速访问设置</span>
        </div>
      </div>
      <button class="shortcut-button" id="shortcutButton" type="button" title="修改快捷键">
        唤起快捷键
        <kbd id="shortcutLabel">读取中…</kbd>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="page-heading">
      <div>
        <h1>网站与搜索词</h1>
        <p>从浏览器书签建立网站索引，再为它们设置便于搜索的关键词。</p>
      </div>
      <div class="page-actions">
        <button class="button button-primary" id="importBookmarksButton" type="button">导入书签</button>
      </div>
    </section>

    <section class="discovery-setting" aria-labelledby="discoverySettingTitle">
      <div class="discovery-setting-copy">
        <strong id="discoverySettingTitle">发现新的西交网站</strong>
        <span>首次访问尚未收录的 <code>*.xjtu.edu.cn</code> 子域名时，在扩展图标上显示添加提示。</span>
      </div>
      <div class="discovery-setting-actions">
        <button class="ignored-hosts-button" id="clearIgnoredHostsButton" type="button" hidden>
          恢复 <span id="ignoredHostsCount">0</span> 个已忽略网站
        </button>
        <label class="setting-switch">
          <input id="siteDiscoveryEnabled" type="checkbox" checked>
          <span aria-hidden="true"></span>
          <b>启用</b>
        </label>
      </div>
    </section>

    <section class="dictionary">
      <aside class="group-sidebar" aria-label="网站分组">
        <div class="group-sidebar-heading">
          <strong>分组</strong>
          <span>数字为书签总数 · ⊘ 停止同步</span>
        </div>
        <nav class="group-tree" id="groupTree" aria-label="网站分组树"></nav>
      </aside>

      <div class="dictionary-content">
        <div class="dictionary-toolbar">
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="filterInput" type="search" placeholder="搜索网站名称、网址或搜索词" autocomplete="off">
          </label>
          <div class="dictionary-count">
            <span id="activeGroupLabel">全部网站</span>
            <strong id="siteCount">0</strong> 个
          </div>
        </div>

        <div class="list-header">
          <label class="site-select site-select-all" title="全选当前结果">
            <input id="selectAllSites" type="checkbox" aria-label="全选当前筛选结果">
          </label>
          <span aria-hidden="true"></span>
          <span>网站与搜索信息</span>
          <span>操作</span>
        </div>
        <div class="site-list" id="siteList" aria-live="polite"></div>
      </div>
      <div class="bulk-actions" id="bulkActions" aria-live="polite" hidden>
        <span>已选择 <strong id="selectedSiteCount">0</strong> 个网站</span>
        <button id="clearSiteSelectionButton" type="button">取消选择</button>
        <button class="bulk-delete-button" id="deleteSelectedSitesButton" type="button">删除所选</button>
      </div>
    </section>

    <footer class="page-footer">
      <div>
        <button id="repositoryButton" type="button">项目主页</button>
      </div>
      <button class="update-state" id="updateStateButton" type="button">
        <span class="update-dot is-loading" id="updateDot"></span>
        <span id="updateStateText">检查版本…</span>
      </button>
    </footer>
  </main>

  <section class="dialog-layer" id="editorLayer" hidden aria-label="编辑网站">
    <form class="dialog editor-dialog" id="siteForm">
      <div class="dialog-heading">
        <div>
          <h2 id="editorTitle">编辑网站</h2>
          <p id="editorSubtitle">一个网站可以设置多个搜索词。</p>
        </div>
        <button class="close-button" id="closeEditorButton" type="button" aria-label="关闭">×</button>
      </div>

      <input id="siteId" type="hidden">
      <p class="bookmark-source-notice" id="bookmarkSourceNotice" hidden>
        名称与网址会和浏览器书签双向同步；搜索词仅保存在扩展中。
      </p>
      <div class="form-grid">
        <label class="form-field">
          <span>网站名称</span>
          <input id="siteName" type="text" maxlength="40" placeholder="例如：研究生信息管理系统" required>
        </label>
        <label class="form-field">
          <span>网址</span>
          <input id="siteUrl" type="url" placeholder="https://…" required>
        </label>
        <label class="form-field form-field-wide">
          <span>搜索词</span>
          <div class="keyword-control">
            <div class="keyword-editor" id="keywordEditor">
              <span class="keyword-tokens" id="keywordTokens"></span>
              <input id="siteKeywords" type="search" maxlength="40" placeholder="搜索或创建关键词" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="keywordSuggestions">
            </div>
            <div class="keyword-suggestions" id="keywordSuggestions" role="listbox" hidden></div>
          </div>
          <small>点击已有搜索词可直接修改；输入新词后按 Enter 或逗号创建。</small>
        </label>
        <label class="form-field form-field-wide">
          <span>用途说明 <i>可选</i></span>
          <input id="siteDescription" type="text" maxlength="80" placeholder="这个网站可以完成什么？">
        </label>
      </div>

      <p class="form-error" id="formError" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancelEditorButton" type="button">取消</button>
        <button class="button-primary" type="submit">保存更改</button>
      </div>
    </form>
  </section>

  <section class="dialog-layer" id="bookmarkLayer" hidden aria-label="导入浏览器书签">
    <div class="dialog bookmark-dialog">
      <div class="dialog-heading">
        <div>
          <h2>导入浏览器书签</h2>
        <p>可选择整个文件夹，也可单独选择网页书签；书签名称用于生成初始搜索词。</p>
        </div>
        <button class="close-button" id="closeBookmarkButton" type="button" aria-label="关闭">×</button>
      </div>
      <label class="search-field bookmark-search">
        <span aria-hidden="true">⌕</span>
        <input id="bookmarkFilterInput" type="search" placeholder="搜索书签或文件夹" autocomplete="off">
      </label>
      <div class="bookmark-toolbar">
        <div>
          <label><input id="selectAllBookmarks" type="checkbox"> 选择当前结果</label>
        </div>
        <span id="bookmarkSelectionCount">已选 0 项</span>
      </div>
      <div class="bookmark-list" id="bookmarkList"></div>
      <div class="dialog-actions">
        <button id="cancelBookmarkButton" type="button">取消</button>
        <button class="button-primary" id="confirmBookmarkButton" type="button" disabled>导入并同步所选书签</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="scripts/vendor/text-search-engine-1.5.2.min.js"></script>
  <script src="scripts/siteData.js"></script>
  <script src="popup.js"></script>
</body>
</html>
